services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: corenting
      POSTGRES_PASSWORD: corenting
      POSTGRES_DB: corenting
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corenting"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - caddy

volumes:
  db_data:

networks:
  caddy:
    external: true
    name: claudespot_default
